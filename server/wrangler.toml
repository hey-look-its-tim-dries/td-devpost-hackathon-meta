name = "pwc"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "pwc"
database_id = "1323f8cf-639c-4c26-b86a-9a394a3d911e"

[[durable_objects.bindings]]
name = "WORLD"
class_name = "World"

[[durable_objects.bindings]]
